domains:
  # ============================================================================
  # CONSTRUCTION DOMAINS / СТРОИТЕЛЬНЫЕ ДОМЕНЫ
  # ============================================================================

  survey:
    - slug: building-inspection
      title: "Обследование зданий"
      summary: "Процесс определения технического состояния зданий и сооружений включая визуальный осмотр, неразрушающий контроль и инструментальные измерения"
    - slug: non-destructive-testing
      title: "Неразрушающий контроль"
      summary: "Методы контроля качества и состояния материалов и конструкций без повреждения объекта"

  monitoring:
    - slug: structural-monitoring
      title: "Мониторинг зданий"
      summary: "Систематическое наблюдение за состоянием зданий и сооружений с использованием датчиков и автоматизированных систем"
    - slug: sensor-systems
      title: "Системы датчиков"
      summary: "Технологии и оборудование для непрерывного сбора данных о состоянии зданий"

  construction-control:
    - slug: construction-control
      title: "Строительный контроль"
      summary: "Совокупность операций по проверке соответствия строительных работ требованиям нормативных документов и проектной документаци"

  forensic:
    - slug: judicial-construction-expertise
      title: "Судебная строительная экспертиза"
      summary: "Строительная экспертиза, проводимая по определению суда или запросу следственных органов"
    - slug: audit
      title: "Аудит и due diligence"
      summary: "Оценка соответствия активов и проектов для инвесторов и кредиторов"

  general:
    - slug: conformity-assessment
      title: "Оценка соответствия"
      summary: "Процедура установления соответствия объекта установленным требованиям"
    - slug: quality-management
      title: "Управление качеством"
      summary: "Управление качеством продукции и процессов"
    - slug: certification
      title: "Сертификация"
      summary: "Процедура подтверждения соответствия продукции, процессов или услуг установленным требованиям"

